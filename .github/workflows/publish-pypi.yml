name: Publish Python Client to PyPI

on:
  push:
    tags:
      - 'py-v*'

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/discord-mock-client
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: packages/client-py
        run: |
          uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypa-publish@release/v1
        with:
          packages-dir: packages/client-py/dist/

